[project]
name = "mekari-fraud-qa"
version = "0.2.0"
description = "Evidence-grounded fraud analytics and document Q&A"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["backend/**/*.py", "frontend/**/*.py", "scripts/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
