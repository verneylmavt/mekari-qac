name: Offline verification
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    env:
      OPENAI_API_KEY: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Fetch the canonical vector artifact
        run: git lfs pull --include="data/corpus/vectors.npy"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m ruff check backend frontend scripts tests
      - run: python -m ruff format --check backend frontend scripts tests
      - run: python -m pytest -q
      - name: Check matching contributor guides and whitespace
        shell: pwsh
        run: |
          if ((Get-FileHash AGENTS.md).Hash -ne (Get-FileHash CLAUDE.md).Hash) { throw 'Contributor guides differ' }
          git diff --check
